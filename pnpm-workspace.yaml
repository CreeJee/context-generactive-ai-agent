packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.8.0
  "@fontsource-variable/inter": ^5.3.0
  "@huggingface/transformers": 4.2.0
  "@oxlint/plugins": 1.79.0
  "@react-router/fs-routes": ^8.3.1
  "@standard-schema/spec": ^1.1.0
  "@streamdown/cjk": ^1.0.3
  "@streamdown/code": ^1.1.1
  "@tanstack/ai": ^0.54.0
  "@tanstack/ai-client": ^0.31.1
  "@tanstack/ai-persistence": ^0.5.7
  "@tanstack/ai-openai": ^0.22.6
  "@tanstack/ai-react": ^0.24.1
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.3.0
  effect: 3.22.2
  json-rpc-2.0: 1.8.0
  p-defer: 4.0.1
  p-event: 7.1.0
  lucide-react: ^1.45.0
  react: ^19.3.0
  react-dom: ^19.3.0
  shadcn: ^4.21.0
  streamdown: ^2.6.0
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  "@agentclientprotocol/sdk": 1.4.0
  "@modelcontextprotocol/sdk": 1.30.0
  "@napi-rs/keyring": 2.1.0
  "@tanstack/ai-mcp": 0.3.10
  cmdk: ^1.1.1
  kiwi-nlp: 0.24.0
  "@openai/codex": 0.154.0
  cross-spawn: 7.0.6
  sharp: 0.34.5
  "@types/cross-spawn": 6.0.6
  "@secretlint/core": 13.0.5
  "@secretlint/secretlint-rule-preset-recommend": 13.0.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  # macOS/arm64 binaries ship in the package; the script only fetches extras such as Linux CUDA.
  onnxruntime-node: false
  # Only prints a version-scheme warning.
  protobufjs: false
  # Image support is unused by text embeddings; prebuilt binaries come from optional deps.
  sharp: false
