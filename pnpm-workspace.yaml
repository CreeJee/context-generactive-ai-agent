packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.8.0
  "@fontsource-variable/inter": ^5.3.0
  "@huggingface/transformers": 4.2.0
  "@oxlint/plugins": 1.79.0
  "@react-router/fs-routes": ^8.3.1
  "@standard-schema/spec": ^1.1.0
  "@streamdown/cjk": ^1.0.3
  "@streamdown/code": ^1.1.1
  "@tanstack/ai": ^0.61.0
  "@tanstack/ai-anthropic": 0.19.1
  "@tanstack/ai-client": ^0.35.1
  "@tanstack/ai-persistence": ^0.6.7
  "@tanstack/ai-openai": ^0.24.1
  "@tanstack/ai-react": ^0.29.1
  "@types/node": ^26.5.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.3.0
  effect: 4.0.0-rc.117
  "@effect/vitest": 4.0.0-rc.117
  lucide-react: ^1.45.0
  react: ^19.3.0
  react-dom: ^19.3.0
  shadcn: ^4.21.0
  streamdown: ^2.6.0
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
  "@agentclientprotocol/sdk": 1.4.0
  "@modelcontextprotocol/sdk": 1.30.0
  "@napi-rs/keyring": 2.1.0
  "@tanstack/ai-mcp": 0.4.6
  cmdk: ^1.1.1
  kiwi-nlp: 0.24.0
  cross-spawn: 7.0.6
  sharp: 0.34.5
  "@types/cross-spawn": 6.0.6
  "@secretlint/core": 13.0.5
  "@secretlint/profiler": 13.0.5
  "@secretlint/secretlint-rule-preset-recommend": 13.0.5
  "@shadcn/lint": ^0.1.0
  motion: ^13.3.0
  dayjs: ^1.11.23
  "@tanstack/ai-compaction": ^0.1.9
  jotai: ^3.0.0
  nuqs: ^2.10.1
  "@tanstack/react-query": ^5.103.1
  "@tanstack/react-virtual": ^3.14.13
  react-simplikit: ^0.3.1
  overlay-kit: ^1.9.0
  ts-pattern: ^5.9.0
  "@effect/tsgo": 0.45.0
  js-tiktoken: ^1.0.21
  undici: ^7.29.1
overrides:
  vite@*: "catalog:"
  vitest: 5.0.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  # macOS/arm64 binaries ship in the package; the script only fetches extras such as Linux CUDA.
  onnxruntime-node: false
  # Only prints a version-scheme warning.
  protobufjs: false
  # Image support is unused by text embeddings; prebuilt binaries come from optional deps.
  sharp: false
minimumReleaseAgeExclude:
  - "@tanstack/ai-anthropic@0.19.1"
  - "@tanstack/ai-client@0.35.1"
  - "@tanstack/ai-compaction@0.1.9"
  - "@tanstack/ai-event-client@0.13.0"
  - "@tanstack/ai-mcp@0.4.6"
  - "@tanstack/ai-openai@0.24.1"
  - "@tanstack/ai-persistence@0.6.7"
  - "@tanstack/ai-react@0.29.1"
  - "@tanstack/ai@0.61.0"
  - "@tanstack/openai-base@0.11.1"
