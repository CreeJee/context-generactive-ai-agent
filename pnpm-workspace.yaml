packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/inter": ^5.3.0
  "@huggingface/transformers": 4.3.2
  "@oxlint/plugins": 1.87.0
  "@react-router/fs-routes": ^8.4.0
  "@streamdown/cjk": ^1.0.4
  "@streamdown/code": ^2.0.0
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  effect: 4.1.2
  "@effect/vitest": 4.1.2
  "@effect/platform-node-shared": 4.1.2
  "@effect/ai-openai-compat": 4.1.2
  "@effect/atom-react": 4.1.2
  lucide-react: ^1.58.0
  react: ^19.3.0
  react-dom: ^19.3.0
  shadcn: ^4.21.0
  streamdown: ^2.7.0
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  "@agentclientprotocol/sdk": 1.9.0
  "@modelcontextprotocol/client": ^2.3.1
  "@modelcontextprotocol/server": ^2.3.1
  "@napi-rs/keyring": 2.1.1
  cmdk: ^1.1.1
  cross-spawn: 7.0.6
  sharp: 0.35.5
  "@types/cross-spawn": 6.0.6
  "@secretlint/core": 13.0.7
  "@secretlint/profiler": 13.0.7
  "@secretlint/secretlint-rule-preset-recommend": 13.0.7
  "@shadcn/lint": ^0.2.1
  motion: ^14.3.0
  dayjs: ^1.11.23
  jotai: ^3.0.1
  nuqs: ^2.10.2
  "@tanstack/react-query": ^5.104.5
  "@tanstack/react-virtual": ^3.14.22
  react-simplikit: ^0.3.3
  overlay-kit: ^1.9.0
  ts-pattern: ^5.9.2
  "@effect/tsgo": 0.53.3
  js-tiktoken: ^1.0.21
  undici: ^8.12.2
  "@vitest/browser-playwright": 5.0.5
  playwright: ^1.64.1
  vitest-browser-react: ^2.3.0
  "@effect/platform-node": 4.1.2
  oxc-transform-react: ^0.154.0
  # Research preview with a changing config format: pinned, upgraded deliberately.
  "@anthropic-ai/sandbox-runtime": 0.0.79
  minimatch: 10.2.6
  "@react-router/dev": ^8.4.0
  "@react-router/node": ^8.4.0
  "@tailwindcss/vite": ^4.3.3
  "@vitejs/plugin-react": ^6.1.2
  bumpp: ^12.3.0
  isbot: ^5.2.2
  react-router: ^8.4.0
  tailwindcss: ^4.3.3
  zod: ^4.6.7
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  # @ttsc/graph speaks a protocol tied to its ttsc release: pinned together, upgraded together.
  ttsc: 0.34.1
  "@ttsc/graph": 0.34.1
  # The code sandbox's engine: the core plus the build with its WASM inside the JS, so the bundled
  # worker needs no file next to it.
  quickjs-emscripten-core: 0.32.0
  "@jitl/quickjs-singlefile-mjs-release-sync": 0.32.0
  sucrase: 3.35.1
  # Checks tool call arguments against the JSON Schema the model was sent, as TanStack did with the
  # same validator (packages/memory-agent/src/tools/input-repair.ts).
  "@cfworker/json-schema": 4.1.1
  "@shadcn/react": ^0.3.1
  # Development-only wording check (lint/wording): Korean morphemes of the Lingui catalogs.
  kiwi-nlp: 0.24.1
  # UI text as Lingui messages: compile-time macros (t, msg, Trans) in the app, the runtime macro on
  # the server. native-tools transforms the macros and extracts the messages without Babel.
  # native-tools is pre-1.0, so every Lingui package is pinned exactly.
  "@lingui/core": 6.12.0
  "@lingui/message-utils": 6.12.0
  "@lingui/format-po": 6.12.0
  "@lingui/react": 6.12.0
  "@lingui/conf": 6.12.0
  "@lingui/cli": 6.12.0
  "@lingui/vite-plugin": 6.12.0
  "@lingui/native-tools": 0.2.0
  # Official Lingui lint rules, loaded as an Oxlint JS plugin: text stays inside messages.
  eslint-plugin-lingui: 0.16.0
overrides:
  vite@*: "catalog:"
  vitest: 5.0.5
  # One zod 4 for every peer; sandbox-runtime keeps its own zod 3.
  "zod@^4": "catalog:"
  effect: "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/vitest": "catalog:"
  # transformers pins onnxruntime-node 1.30.0, whose WebGPU crashes when the embedder and the
  # reranker run at the same time (microsoft/onnxruntime#31627, fixed in 1.31.1). Remove once a
  # transformers release depends on 1.31.1 (huggingface/transformers.js#1879).
  "@huggingface/transformers>onnxruntime-node": 1.31.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  # macOS/arm64 binaries ship in the package; the script only fetches extras such as Linux CUDA.
  onnxruntime-node: false
  # Only prints a version-scheme warning.
  protobufjs: false
  # Image support is unused by text embeddings; prebuilt binaries come from optional deps.
  sharp: false
minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.53.3"
  - "@effect/tsgo-darwin-x64@0.53.3"
  - "@effect/tsgo-linux-arm64@0.53.3"
  - "@effect/tsgo-linux-arm@0.53.3"
  - "@effect/tsgo-linux-x64@0.53.3"
  - "@effect/tsgo-win32-arm64@0.53.3"
  - "@effect/tsgo-win32-x64@0.53.3"
  - "@effect/tsgo@0.53.3"
patchedDependencies:
  "@effect/platform-node-shared@4.1.2": patches/@effect__platform-node-shared@4.1.2.patch
  "@effect/platform-node@4.1.2": patches/@effect__platform-node@4.1.2.patch
  effect@4.1.2: patches/effect@4.1.2.patch
  react-simplikit@0.3.3: patches/react-simplikit@0.3.3.patch
