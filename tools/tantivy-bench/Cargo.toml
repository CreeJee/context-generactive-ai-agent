[package]
name = "tantivy-bench"
version = "0.1.0"
edition = "2021"
publish = false

# A benchmark on a copy of a storage folder, not product code: it builds Tantivy indexes of the
# copy's nodes and runs the search set's items against them.
[workspace]

[dependencies]
tantivy = "=0.27.0"
lindera = { version = "=6.2.0", features = ["embed-ko-dic"] }
regex = "=1.13.1"
unicode-normalization = "=0.1.26"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
